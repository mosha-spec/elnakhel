{t:"اللهم إني أسألك علما نافعا ورزقا طيبا وعملا متقبلا", c:1, s:"رواه ابن ماجه وصححه الألباني", v:"بعد الفجر"},
];

// النوم - النص الكامل وكل تسبيحة لواحدها
const SLEEP = [
{t:"باسمك اللهم أموت وأحيا", c:1, s:"رواه البخاري"},
{t:"باسمك ربي وضعت جنبي وبك أرفعه، فإن أمسكت نفسي فارحمها وإن أرسلتها فاحفظها بما تحفظ به عبادك الصالحين", c:1, s:"متفق عليه"},
{t:"اللهم قني عذابك يوم تبعث عبادك", c:3, s:"رواه أبو داود وصححه الألباني"},
{t:"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ", c:1, s:"رواه البخاري", v:"لا يزال عليك من الله حافظ حتى تصبح"},
{t:"آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ، لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ", c:1, s:"متفق عليه", v:"كفتاه - آخر آيتين من البقرة"},
{t:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ قُلْ هُوَ اللَّهُ أَحَدٌ، اللَّهُ الصَّمَدُ، لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ\n\nقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ، مِن شَرِّ مَا خَلَقَ، وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ، وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ، وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ\n\nقُلْ أَعُوذُ بِرَبِّ النَّاسِ، مَلِكِ النَّاسِ، إِلَٰهِ النَّاسِ، مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ، الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ، مِنَ الْجِنَّةِ وَالنَّاسِ - ثم ينفث في كفيه ويمسح جسده", c:3, s:"رواه البخاري"},
{t:"سبحان الله", c:33, s:"متفق عليه", v:"تسبيح النوم - وصية فاطمة"},
{t:"الحمد لله", c:33, s:"متفق عليه"},
{t:"الله أكبر", c:34, s:"متفق عليه"},
{t:"اللهم أسلمت نفسي إليك وفوضت أمري إليك ووجهت وجهي إليك وألجأت ظهري إليك رغبة ورهبة إليك لا ملجأ ولا منجا منك إلا إليك آمنت بكتابك الذي أنزلت ونبيك الذي أرسلت", c:1, s:"متفق عليه", v:"فإن مت من ليلتك مت على الفطرة"},
];

const WAKE = [
{t:"الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور", c:1, s:"رواه البخاري"},
{t:"الحمد لله الذي عافاني في جسدي ورد علي روحي وأذن لي بذكره", c:1, s:"رواه الترمذي وحسنه الألباني"},
{t:"لا إله إلا الله وحده لا شريك له له الملك وله الحمد وهو على كل شيء قدير، سبحان الله والحمد لله ولا إله إلا الله والله أكبر ولا حول ولا قوة إلا بالله", c:1, s:"رواه البخاري", v:"من تعار من الليل فقاله ثم دعا استجيب له"},
];

function App(){
const [tab,setTab]=useState('morning');
const [progress,setProgress]=useState(()=>{
try{const s=localStorage.getItem('azkar-v4'); return s?JSON.parse(s):{morning:{},evening:{},after:{},sleep:{},wake:{}} }catch{return{morning:{},evening:{},after:{},sleep:{},wake:{}}}
});
const [toast,setToast]=useState(null);
const [anim,setAnim]=useState(null);
const [fontSize,setFontSize]=useState(()=>localStorage.getItem('azkar-font')||'md');

useEffect(()=>{localStorage.setItem('azkar-v4',JSON.stringify(progress))},[progress]);
useEffect(()=>{localStorage.setItem('azkar-font',fontSize)},[fontSize]);

const tabs = {
morning:{label:'الصباح', icon:'🌅', data:BASE.filter(x=>!x.eo).map(x=>({id:x.id, text:x.m, c:x.c, s:x.s, v:x.v}))},
evening:{label:'المساء', icon:'🌙', data:BASE.map(x=>({id:x.id, text:x.e, c:x.c, s:x.s, v:x.v}))},
after:{label:'بعد الصلاة', icon:'🕌', data:AFTER.map((x,i)=>({id:100+i, text:x.t, c:x.c, s:x.s, v:x.v}))},
sleep:{label:'النوم', icon:'😴', data:SLEEP.map((x,i)=>({id:200+i, text:x.t, c:x.c, s:x.s, v:x.v}))},
wake:{label:'الاستيقاظ', icon:'☀️', data:WAKE.map((x,i)=>({id:300+i, text:x.t, c:x.c, s:x.s, v:x.v}))},
};

const getDone=(cat,id)=>progress[cat]?.[id]||0;
const totalDone=(cat)=>tabs[cat].data.filter(it=>getDone(cat,it.id)>=it.c).length;
const total=(cat)=>tabs[cat].data.length;

const doTasbeeh=(cat,it)=>{
const d=getDone(cat,it.id);
if(d>=it.c) return;
const nd=d+1;
setProgress(p=>({...p, [cat]:{...p[cat], [it.id]:nd}}));
setAnim(cat+'-'+it.id);
setTimeout(()=>setAnim(null),200);
if(navigator.vibrate) navigator.vibrate(nd===it.c?[40,80,120]:25);
if(nd===it.c){
setToast('تم ✓');
setTimeout(()=>setToast(null),1500);
}
};
const resetOne=(cat,id)=>{setProgress(p=>{const n={...p}; if(n[cat]) delete n[cat][id]; return n;})};
const resetCat=(cat)=>{if(confirm(`إعادة ${tabs[cat].label}؟`)) setProgress(p=>({...p,[cat]:{}}))};

const copyT=async(t)=>{try{await navigator.clipboard.writeText(t); setToast('تم النسخ ✓'); setTimeout(()=>setToast(null),1200);}catch{}};

const fontCls = fontSize==='sm'?'text-[15px] leading-[2]':fontSize==='lg'?'text-[20px] leading-[2.1]':'text-[17px] leading-[2]';

return (
<div className="min-h-screen pb-24">
<header className="sticky top-0 z-40 bg-[#0A0E1A]/95 backdrop-blur-xl border-b border-[#C9A86A15]">
<div className="max-w-[880px] mx-auto px-4 py-3 flex items-center justify-between">
<div className="flex items-center gap-3">
<div className="w-10 h-10 rounded-[12px] bg-[#151B2E] border border-[#C9A86A25] flex items-center justify-center"><span className="text-[#C9A86A] font-extrabold text-[18px]">ﷺ</span></div>
<div><div className="font-extrabold text-[15px]">أذكاري - النص الكامل</div><div className="text-[11px] text-white/40">كل تسبيحة بعداد منفصل • صحيح فقط</div></div>
</div>
<div className="flex items-center gap-2">
<div className="flex p-1 rounded-full bg-[#151B2E] border border-white/10">
<button onClick={()=>setFontSize('sm')} className={`w-7 h-7 rounded-full text-[11px] ${fontSize==='sm'?'bg-[#C9A86A] text-[#0A0E1A]':'text-white/50'}`}>ص</button>
<button onClick={()=>setFontSize('md')} className={`w-7 h-7 rounded-full text-[11px] ${fontSize==='md'?'bg-[#C9A86A] text-[#0A0E1A]':'text-white/50'}`}>م</button>
<button onClick={()=>setFontSize('lg')} className={`w-7 h-7 rounded-full text-[11px] ${fontSize==='lg'?'bg-[#C9A86A] text-[#0A0E1A]':'text-white/50'}`}>ك</button>
</div>
</div>
</div>
<div className="max-w-[880px] mx-auto px-4 pb-3 flex gap-2 overflow-x-auto">
{Object.keys(tabs).map(k=>{
const d=totalDone(k); const t=total(k); const active=tab===k;
return <button key={k} onClick={()=>setTab(k)} className={`shrink-0 px-4 py-2.5 rounded-[14px] border text-[13px] font-bold flex items-center gap-2 ${active?'bg-[#C9A86A] text-[#0A0E1A] border-[#C9A86A]':'bg-[#151B2E] text-white/60 border-[#C9A86A15]'}`}><span>{tabs[k].icon}</span>{tabs[k].label} <span className={`px-1.5 py-0.5 rounded-full text-[10px] ${active?'bg-black text-[#C9A86A]':'bg-black/50'}`}>{d}/{t}</span></button>
})}
</div>
</header>

<div className="max-w-[880px] mx-auto px-4 mt-4">
<div className="rounded-[14px] bg-[#151B2E] border border-[#C9A86A15] p-3 flex items-center justify-between">
<div className="flex items-center gap-2"><span className="text-[18px]">{tabs[tab].icon}</span><span className="text-[13px] font-bold">أذكار {tabs[tab].label} - {totalDone(tab)}/{total(tab)}</span></div>
<button onClick={()=>resetCat(tab)} className="text-[11px] px-3 py-1.5 rounded-full bg-[#0A0E1A] border border-white/10 text-white/60">إعادة القسم</button>
</div>
</div>

<div className="max-w-[880px] mx-auto px-4 mt-4 grid gap-4">
{tabs[tab].data.map(it=>{
const done=getDone(tab,it.id);
const isDone=done>=it.c;
const rem=it.c-done;
return (
<div key={tab+'-'+it.id} className={`rounded-[18px] border p-4 transition-all ${isDone?'bg-[#102116] border-[#22c55e30] green-glow':'bg-[#151B2E] border-[#C9A86A12]'}`}>
<div className="flex items-center justify-between mb-3">
<div className="flex items-center gap-2">
<span className={`w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-bold border ${isDone?'bg-[#22c55e] text-white border-[#22c55e]':'bg-[#0A0E1A] text-[#C9A86A] border-[#C9A86A20]'}`}>{isDone?'✓':it.id%100}</span>
<span className="text-[10px] px-2 py-1 rounded-full bg-[#0A0E1A] border border-white/10 text-white/50">{it.s}</span>
</div>
<span className={`text-[11px] font-bold px-2.5 py-1 rounded-full border ${isDone?'bg-[#22c55e20] text-[#22c55e] border-[#22c55e30]':'bg-[#C9A86A10] text-[#C9A86A] border-[#C9A86A20]'}`}>{isDone?'تم ✓':`${rem} متبقي من ${it.c}`}</span>
</div>

<p className={`amiri ${fontCls} text-white/90 whitespace-pre-wrap break-words`}>{it.text}</p>

{it.v && <div className="mt-3 text-[11px] px-3 py-2 rounded-[10px] bg-[#C9A86A10] border border-[#C9A86A15] text-[#C9A86A]/80">فضلها: {it.v}</div>}

{it.c>1 && (
<div className="mt-4 flex flex-wrap gap-1.5">
{Array.from({length:it.c}).map((_,i)=>(
<div key={i} className={`w-2.5 h-2.5 rounded-full transition-all ${i<done?'bg-[#C9A86A] shadow-[0_0_6px_rgba(201,168,106,.6)]':'bg-white/10'}`} style={{transform: anim===tab+'-'+it.id && i===done-1?'scale(1.4)':'scale(1)'}}></div>
))}
<span className="text-[11px] text-white/40 mr-2">{done}/{it.c}</span>
</div>
)}

<div className="mt-4 flex gap-2">
<button onClick={()=>doTasbeeh(tab,it)} disabled={isDone} className={`flex-1 h-[46px] rounded-[12px] font-extrabold text-[14px] active:scale-95 transition-all flex items-center justify-center gap-2 ${isDone?'bg-[#22c55e15] border border-[#22c55e30] text-[#22c55e]':'bg-[#C9A86A] text-[#0A0E1A] shadow-[0_4px_14px_rgba(201,168,106,.3)]'} ${anim===tab+'-'+it.id?'pop':''}`}>
{isDone?'✓ تم':'سبّح'} {it.c>1?`(${done}/${it.c})`:''}
</button>
<button onClick={()=>copyT(it.text)} className="w-12 h-12 rounded-[12px] bg-[#0A0E1A] border border-white/10 text-white/60">⎙</button>
{done>0 && <button onClick={()=>resetOne(tab,it.id)} className="w-12 h-12 rounded-[12px] bg-[#0A0E1A] border border-white/10 text-white/40">↺</button>}
</div>
</div>
)
})}

{totalDone(tab)===total(tab) && total(tab)>0 && (
<div className="rounded-[18px] bg-gradient-to-br from-[#22c55e15] to-[#C9A86A10] border border-[#22c55e25] p-6 text-center splash">
<div className="text-2xl">🎉</div>
<div className="font-bold text-[16px] mt-2">تقبّل الله أذكار {tabs[tab].label}</div>
</div>
)}
</div>

<footer className="max-w-[880px] mx-auto px-4 mt-8 text-center">
<div className="rounded-[14px] bg-[#151B2E] border border-[#C9A86A12] p-4">
<p className="text-[10px] text-white/30 leading-6">جميع الأذكار صحيحة ثابتة عن النبي ﷺ - البخاري ومسلم وأبو داود والترمذي - تم الاقتصار على الصحيح فقط</p>
<div className="mt-2 text-[#C9A86A] font-bold text-[13px]">﴿ فَاذْكُرُونِي أَذْكُرْكُمْ ﴾</div>
</div>
</footer>

{toast && <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#151B2E] border border-[#C9A86A25] px-5 py-2.5 rounded-full text-[13px] shadow-xl z-50 splash">{toast}</div>}
</div>
)
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
